name: Validate website

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test scripts/google-ads.test.mjs
      - run: npm run ringotel:test
      - run: npm run ringotel:check
      - run: npm run ringotel:smoke
      - run: npm run build
